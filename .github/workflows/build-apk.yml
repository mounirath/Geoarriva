name: Build Android APK (Cordova)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies with Bun
        run: bun install

      - name: Build Web Project (Vite)
        env:
          VITE_ADMOB_CLIENT_ID: "ca-app-pub-1050422776945344~6855047295"
          VITE_ADMOB_SLOT_ID: "ca-app-pub-1050422776945344/8752251197"
        run: bun run build

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Generate Android APK with Cordova
        run: |
          cordova create temp-app com.geoarriva.app Geoarriva
          cd temp-app
          
          rm -rf www/*
          cp -r ../dist/* www/
          
          # Plugin AdMob officiel configuré avec votre ID
          cordova plugin add cordova-plugin-admob-free --variable ADMOB_APP_ID="ca-app-pub-1050422776945344~6855047295"
          cordova plugin add cordova-plugin-androidx-adapter
          
          # Plugin Geolocation officiel pour activer l'accès GPS natif dans AndroidManifest
          cordova plugin add cordova-plugin-geolocation
          
          cordova platform add android

          # Vérification et garantie des permissions GPS dans AndroidManifest.xml
          MANIFEST="platforms/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" />' "$MANIFEST"
            fi
          fi
          
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geoarriva-debug-apk
          path: temp-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
