name: Build Android APK (Cordova)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies with Bun
        run: bun install

      - name: Build Web Project (Vite)
        env:
          VITE_CARTO_API_KEY: "cb1_48if_2_0f3fe5e8cce7bab4ee01bfc8"
          VITE_UNITY_GAME_ID: "800387003"
          VITE_UNITY_BANNER_PLACEMENT: "BP_Banner_Android"
          VITE_UNITY_INTERSTITIAL_PLACEMENT: "BP_Interstitial_Android"
        run: bun run build

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Generate Android APK with Cordova
        run: |
          # 1. Création du projet Cordova
          cordova create temp-app com.arreva.app Arreva
          cd temp-app
          
          rm -rf www/*
          cp -r ../dist/* www/
          
          # 2. Configuration de l'icône de l'application
          mkdir -p res
          cp ../public/icons/icon-512.png res/icon.png
          sed -i '/<\/widget>/i \    <icon src="res/icon.png" />' config.xml
          
          # 3. Préparation autonome du plugin Unity Ads compatible SDK 4.5.0
          rm -rf /tmp/unity-plugin
          git clone https://github.com/emi-indo/emi-indo-cordova-plugin-unityads.git /tmp/unity-plugin
          
          # Correction du plugin.xml (séparation stricte de AndroidManifest.xml et res/xml/config.xml)
          cat << 'EOF' > /tmp/unity-plugin/plugin.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <plugin xmlns="http://apache.org/cordova/ns/plugins/1.0"
                  xmlns:android="http://schemas.android.com/apk/res/android"
                  id="emi-indo-cordova-plugin-unityads"
                  version="0.0.3">
            <name>emiUnityAdsPlugin</name>
            <description>Cordova Plugin Unity Ads</description>
            <author>EMI INDO</author>
            <license>ISC</license>

            <js-module src="www/emiUnityAdsPlugin.js" name="emiUnityAdsPlugin">
              <clobbers target="cordova.plugins.emiUnityAdsPlugin"/>
              <clobbers target="UnityAds"/>
            </js-module>

            <engines>
              <engine name="cordova" version=">=10.0.0"/>
              <engine name="cordova-android" version=">=10.0.0"/>
            </engines>

            <platform name="android">
              <config-file target="res/xml/config.xml" parent="/*">
                <feature name="emiUnityAdsPlugin">
                  <param name="android-package" value="emi.indo.cordova.plugin.unityads.emiUnityAdsPlugin"/>
                </feature>
              </config-file>

              <config-file target="AndroidManifest.xml" parent="/*">
                <uses-permission android:name="android.permission.INTERNET"/>
                <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
                <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>
              </config-file>

              <config-file target="AndroidManifest.xml" parent="/manifest/application">
                <activity
                    android:name="com.unity3d.ads.adunit.AdUnitActivity"
                    android:configChanges="fontScale|keyboard|keyboardHidden|locale|mnc|mcc|navigation|orientation|screenLayout|screenSize|smallestScreenSize|uiMode|touchscreen"
                    android:hardwareAccelerated="true"
                    android:theme="@android:style/Theme.NoTitleBar.Fullscreen" />
                <activity
                    android:name="com.unity3d.ads.adunit.AdUnitSoftwareActivity"
                    android:configChanges="fontScale|keyboard|keyboardHidden|locale|mnc|mcc|navigation|orientation|screenLayout|screenSize|smallestScreenSize|uiMode|touchscreen"
                    android:hardwareAccelerated="false"
                    android:theme="@android:style/Theme.NoTitleBar.Fullscreen" />
              </config-file>

              <source-file src="src/android/emiUnityAdsPlugin.java" target-dir="src/emi/indo/cordova/plugin/unityads"/>
              <framework src="com.unity3d.ads:unity-ads:4.5.0"/>
            </platform>
          </plugin>
          EOF

          # Nettoyage sécurisé du code source Java du plugin
          sed -i 's/super.onDestroy();//g' /tmp/unity-plugin/src/android/emiUnityAdsPlugin.java
          sed -i 's/UnityAds.initialize(cordova.getActivity(),unityGameID,/UnityAds.initialize(cordova.getActivity(),unityGameID,true,/g' /tmp/unity-plugin/src/android/emiUnityAdsPlugin.java

          # 4. Installation des plugins Cordova
          cordova plugin add /tmp/unity-plugin
          cordova plugin add cordova-plugin-androidx-adapter
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-geolocation
          
          # 5. Ajout de la plateforme Android
          cordova platform add android
          
          # 6. Nettoyage de sécurité préventif sur res/xml/config.xml
          CONFIG_XML="platforms/android/app/src/main/res/xml/config.xml"
          if [ -f "$CONFIG_XML" ]; then
            sed -i '/<uses-permission/d' "$CONFIG_XML"
            sed -i '/<activity/d' "$CONFIG_XML"
            sed -i '/<\/activity>/d' "$CONFIG_XML"
            sed -i '/<config-file/d' "$CONFIG_XML"
            sed -i '/<\/config-file>/d' "$CONFIG_XML"
          fi

          # 7. Garantie des permissions GPS dans AndroidManifest.xml
          MANIFEST="platforms/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" />' "$MANIFEST"
            fi
          fi
          
          # 8. Compilation de l'APK
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arreva-debug-apk
          path: temp-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
