name: Build Android APK (Cordova)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies with Bun
        run: bun install

      - name: Build Web Project (Vite)
        env:
          VITE_UNITY_GAME_ID: "800387003"
          VITE_UNITY_BANNER_PLACEMENT: "BP_Banner_Android"
          VITE_UNITY_INTERSTITIAL_PLACEMENT: "BP_Interstitial_Android"
        run: bun run build

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Generate Android APK with Cordova
        run: |
          cordova create temp-app com.arreva.app Arreva
          cd temp-app
          
          rm -rf www/*
          cp -r ../dist/* www/
          
          # Configuration de l'icône officielle de l'application
          mkdir -p res
          cp ../public/icons/icon-512.png res/icon.png
          sed -i '/<\/widget>/i \    <icon src="res/icon.png" />' config.xml
          
          # Plugin Unity Ads officiel validé et corrigé (sans nesting d'AndroidManifest dans config.xml)
          cordova plugin add ../cordova-plugins/cordova-plugin-unityads
          cordova plugin add cordova-plugin-androidx-adapter
          
          # Plugins Geolocation et Permissions Android
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-geolocation
          
          cordova platform add android
          
          # Nettoyage préventif strict de res/xml/config.xml (évite le bug AAPT2 AttributePrefixUnbound)
          CONFIG_XML="platforms/android/app/src/main/res/xml/config.xml"
          if [ -f "$CONFIG_XML" ]; then
            sed -i '/<uses-permission/d' "$CONFIG_XML"
            sed -i '/<activity/d' "$CONFIG_XML"
            sed -i '/<\/activity>/d' "$CONFIG_XML"
            sed -i '/<config-file/d' "$CONFIG_XML"
            sed -i '/<\/config-file>/d' "$CONFIG_XML"
          fi

          # Vérification et injection des permissions dans AndroidManifest.xml
          MANIFEST="platforms/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" />' "$MANIFEST"
            fi
            if ! grep -q "ACCESS_NETWORK_STATE" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />' "$MANIFEST"
            fi
          fi
          
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arreva-debug-apk
          path: temp-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
