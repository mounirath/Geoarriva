name: Release Android APK (GitHub Releases)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version du tag (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies with Bun
        run: bun install

      - name: Build Web Application (Vite)
        env:
          VITE_CARTO_API_KEY: "cb1_48if_2_0f3fe5e8cce7bab4ee01bfc8"
          VITE_UNITY_GAME_ID: "800387003"
          VITE_UNITY_BANNER_PLACEMENT: "BP_Banner_Android"
          VITE_UNITY_INTERSTITIAL_PLACEMENT: "BP_Interstitial_Android"
        run: bun run build

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Build Android APK with Cordova
        run: |
          cordova create temp-app com.arreva.app Arreva
          cd temp-app
          
          rm -rf www/*
          cp -r ../dist/* www/
          
          mkdir -p res
          cp ../public/icons/icon-512.png res/icon.png
          sed -i '/<\/widget>/i \    <icon src="res/icon.png" />' config.xml
          
          cordova plugin add cordova-plugin-androidx-adapter
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add cordova-plugin-geolocation
          
          cordova platform add android
          
          CONFIG_XML="platforms/android/app/src/main/res/xml/config.xml"
          if [ -f "$CONFIG_XML" ]; then
            sed -i '/<uses-permission/d' "$CONFIG_XML"
            sed -i '/<activity/d' "$CONFIG_XML"
            sed -i '/<\/activity>/d' "$CONFIG_XML"
            sed -i '/<config-file/d' "$CONFIG_XML"
            sed -i '/<\/config-file>/d' "$CONFIG_XML"
          fi

          MANIFEST="platforms/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />\n    <uses-feature android:name="android.hardware.location.gps" />' "$MANIFEST"
            fi
            if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
              sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-1050422776945344~6855047295" />' "$MANIFEST"
            fi
          fi
          
          cordova build android --release -- --packageType=apk || cordova build android --debug
          
          if [ -f "platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk ../arreva-release.apk
          else
            cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../arreva-release.apk
          fi

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: arreva-release.apk
          name: "Arreva Mobile Android - ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
