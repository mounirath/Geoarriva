name: Release Android APK (GitHub Releases)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version du tag (ex: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies with Bun
        run: bun install

      - name: Build Web Application (Vite)
        env:
          VITE_ADMOB_CLIENT_ID: "ca-app-pub-1050422776945344~6855047295"
          VITE_ADMOB_SLOT_ID: "ca-app-pub-1050422776945344/8752251197"
        run: bun run build

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Build Android APK with Cordova
        run: |
          cordova create temp-app com.geoarriva.app Geoarriva
          cd temp-app
          
          rm -rf www/*
          cp -r ../dist/* www/
          
          # Plugin AdMob avec l'identifiant AdMob
          cordova plugin add cordova-plugin-admob-free --variable ADMOB_APP_ID="ca-app-pub-1050422776945344~6855047295"
          cordova plugin add cordova-plugin-androidx-adapter
          cordova plugin add cordova-plugin-geolocation
          
          cordova platform add android
          cordova build android --debug
          
          mkdir -p ../release-output
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../release-output/geoarriva-${{ github.event.inputs.version_tag || github.ref_name }}.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          name: "Geoarriva ${{ github.event.inputs.version_tag || github.ref_name }}"
          body: |
            ### 📱 Application mobile Android Geoarriva
            - **Alerte GPS d'arrivée** pour les transports en commun.
            - **Intégration Google AdMob** (App Open Ad).
            - Support des autorisations GPS natives Android.
            
            Téléchargez le fichier `.apk` ci-dessous et installez-le sur votre smartphone Android.
          files: release-output/*.apk
          draft: false
          prerelease: false
