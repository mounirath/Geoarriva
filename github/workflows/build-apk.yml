name: Build APK Without Capacitor

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Bun & Dependencies
      run: |
        npm install -g bun
        bun install

    - name: Build Web Project (Vite)
      run: bun run build

    - name: Install Cordova CLI
      run: npm install -g cordova

    - name: Generate Android APK with Cordova
      run: |
        # Création d'un projet Cordova temporaire
        cordova create temp-app com.geoarriva.app Geoarriva
        cd temp-app
        
        # Remplacement du contenu par la version compilée de Vite (dossier dist)
        rm -rf www/*
        cp -r ../dist/* www/
        
        # Ajout de la plateforme Android et compilation Debug
        cordova platform add android
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: geoarriva-debug-apk
        path: temp-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
